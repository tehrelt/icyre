# Production TLS overlay for API Gateway (EPIC-032).
# Usage:
#   TLS_CERT_DIR=/path/to/certs docker compose -f docker-compose.yml -f deploy/gateway/compose.prod.yml up -d
# Expects tls.crt and tls.key inside TLS_CERT_DIR, and optional cors-origins.conf.
services:
  gateway:
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes: !override
      - ./deploy/gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/gateway/routes.conf:/etc/nginx/routes.conf:ro
      - ${TLS_CERT_DIR:-./deploy/gateway/certs}:/etc/nginx/certs:ro
      - ${CORS_ORIGINS_FILE:-./deploy/gateway/cors-origins.example.conf}:/etc/nginx/cors-origins.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 3s
      retries: 10

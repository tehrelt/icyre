# ICYRE API Gateway (EPIC-032, local stand).
# Routing, request ID, JSON access logs, rate limiting. TLS terminates here in production.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Reuse a well-formed client X-Request-ID, otherwise generate one.
    map $http_x_request_id $req_id {
        default                 $request_id;
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","service":"api-gateway","request_id":"$req_id",'
                                '"method":"$request_method","path":"$uri","status":$status,'
                                '"bytes":$body_bytes_sent,"duration":$request_time,'
                                '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Per-client rate limit for the public API (429 when exceeded).
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    # Docker DNS: resolve upstreams at request time so restarts are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 8080;

        set $bff     http://bff:8080;
        set $catalog http://catalog:8080;
        set $auth    http://auth:8080;
        set $profile http://user-profile:8080;
        set $stream  http://stream-auth:8080;
        set $search  http://search:8080;
        set $library http://library:8080;
        set $playback http://playback:8080;
        set $history  http://history:8080;
        set $playlist http://playlist:8080;
        set $media    http://media-ingest:8080;
        set $recommendation http://recommendation:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-ID      $req_id;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        # Upstreams echo the ID too; send it once.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;

        default_type application/json;

        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        # Page-oriented API for the web client → Web BFF.
        location /api/v1/pages/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $bff;
        }

        # Public catalogue reads → Catalog Service. Writes are not exposed to
        # clients through the gateway (admin tooling goes through Admin Service).
        location ~ ^/api/v1/(artists|albums|tracks|genres)(/|$) {
            limit_req zone=api burst=100 nodelay;
            limit_except GET {
                deny all;
            }
            proxy_pass $catalog;
        }

        # Credential endpoints: a tight per-client limit on top of Auth's own
        # per-account login throttling.
        location ~ ^/api/v1/auth/(login|register|refresh)$ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $auth;
        }

        location /api/v1/auth/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $auth;
        }

        # Profiles → User Profile Service (GET /users/{id}, GET/PATCH /users/me).
        location /api/v1/users/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $profile;
        }

        # Playback authorization → Stream Authorization (returns a signed URL;
        # audio bytes never pass through the gateway).
        location = /api/v1/stream/authorize {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $stream;
        }

        # Upload sessions → Media Ingest (issues presigned PUTs; file bytes go
        # browser → object storage, never through the gateway).
        location /api/v1/media/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass $media;
        }

        # The listener's library (saved tracks and albums) → Library Service.
        location /api/v1/me/library/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $library;
        }

        # Personal recommendations (popular for guests) → Recommendation Service.
        location /api/v1/recommendations/ {
            limit_req zone=api burst=100 nodelay;
            limit_except GET {
                deny all;
            }
            proxy_pass $recommendation;
        }

        # The listener's listening history → Listening History Service.
        location /api/v1/me/history/ {
            limit_req zone=api burst=100 nodelay;
            limit_except GET {
                deny all;
            }
            proxy_pass $history;
        }

        # Playlists → Playlist Service (the listener's own list is /me/playlists).
        location ~ ^/api/v1/(playlists(/|$)|me/playlists$) {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $playlist;
        }

        # Player telemetry → Playback Service (started / finished / skipped).
        location = /api/v1/playback/events {
            limit_req zone=api burst=100 nodelay;
            proxy_pass $playback;
        }

        # Full-text search and autocomplete → Search Service (read-only).
        location ~ ^/api/v1/search(/suggest)?$ {
            limit_req zone=api burst=100 nodelay;
            limit_except GET {
                deny all;
            }
            proxy_pass $search;
        }

        error_page 403 = @forbidden;
        location @forbidden {
            return 403 '{"error":{"code":"FORBIDDEN","message":"Method not allowed through the public API","requestId":"$req_id"}}';
        }

        error_page 429 = @ratelimited;
        location @ratelimited {
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","requestId":"$req_id"}}';
        }

        error_page 502 503 504 = @unavailable;
        location @unavailable {
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service is temporarily unavailable","requestId":"$req_id"}}';
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"No such API route","requestId":"$req_id"}}';
        }
    }
}

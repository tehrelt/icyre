# ICYRE API Gateway (EPIC-032, production TLS termination).
# Terminates TLS 1.2/1.3 on :8443, redirects HTTP :8080 -> HTTPS, enforces
# explicit CORS origins from /etc/nginx/cors-origins*.conf, and shares routes.conf.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Reuse a well-formed client X-Request-ID, otherwise generate one.
    map $http_x_request_id $req_id {
        default                 $request_id;
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    }

    # CORS: production allows only explicitly configured origins via
    # /etc/nginx/cors-origins*.conf (no wildcard localhost).
    map $http_origin $cors_origin {
        default "";
        include /etc/nginx/cors-origins*.conf;
    }
    map $cors_origin $cors_credentials {
        ""      "";
        default "true";
    }
    map $cors_origin $cors_methods {
        ""      "";
        default "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    }
    map $cors_origin $cors_headers {
        ""      "";
        default "Authorization, Content-Type, X-Request-ID";
    }
    map $cors_origin $cors_expose {
        ""      "";
        default "X-Request-ID, Location";
    }
    map $cors_origin $cors_max_age {
        ""      "";
        default "86400";
    }

    log_format json escape=json '{"time":"$time_iso8601","service":"api-gateway","request_id":"$req_id",'
                                '"method":"$request_method","path":"$uri","status":$status,'
                                '"bytes":$body_bytes_sent,"duration":$request_time,'
                                '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    geo $rate_limit_exempt {
        default 0;
        include /etc/nginx/ratelimit-exempt*.conf;
    }
    map $rate_limit_exempt $limit_key {
        1       "";
        default $binary_remote_addr;
    }

    limit_req_zone $limit_key zone=api:10m rate=50r/s;
    limit_req_zone $limit_key zone=auth:10m rate=5r/s;
    limit_req_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 1m;

    # Plain HTTP: keep /health for internal probes and redirect everything else to HTTPS.
    server {
        listen 8080;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS termination.
    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security        "max-age=31536000; includeSubDomains" always;
        add_header X-Request-ID                     $req_id           always;
        add_header Vary                             Origin            always;
        add_header Access-Control-Allow-Origin      $cors_origin      always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Allow-Methods     $cors_methods     always;
        add_header Access-Control-Allow-Headers     $cors_headers     always;
        add_header Access-Control-Expose-Headers    $cors_expose      always;
        add_header Access-Control-Max-Age           $cors_max_age     always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        include /etc/nginx/routes.conf;
    }
}

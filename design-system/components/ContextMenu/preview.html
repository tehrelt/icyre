<!-- @dsCard group="Overlays" height=330 subtitle="Right-click a track" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ContextMenu — preview</title>
<style>
html,body{margin:0}
body{padding:16px;background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:22px}
.pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:12px}
.pv-grid{display:grid;gap:16px}
.pv-cap{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:var(--text-tertiary);min-width:64px}
.pv-sep{width:1px;height:28px;background:var(--border-subtle);margin:0 4px}
.pv-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--border-subtle);color:var(--text-primary)}
.pv-icon .pv-cap{min-width:0;font-size:10px}

</style></head>
<body>
<div id="root"></div>
<script>
var I = window.Icyre, h = React.createElement;
function row(){ return h.apply(null, ['div', {className:'pv-row'}].concat([].slice.call(arguments))); }
function cap(t){ return h('span',{className:'pv-cap'},t); }
function mount(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
var items = [
  {id:'q',label:'Add to queue',icon:'queue'},{id:'p',label:'Add to playlist',icon:'plus'},{id:'l',label:'Save to Liked',icon:'heart'},
  {divider:true},
  {id:'a',label:'Go to artist',icon:'user'},{id:'al',label:'Go to album',icon:'library'},
  {divider:true},
  {id:'r',label:'Remove from playlist',icon:'close',danger:true}
];
mount(h(I.ContextMenu,{items:items,defaultPosition:{x:180,y:40}},
  h('div',{style:{maxWidth:640}}, h(I.TrackRow,{index:3,title:'Glass Tides',artist:'Nova Hale',album:'Prism Hours',duration:227,art:0,state:'hover'}))
));
</script>
</body>
</html>

<!-- @dsCard group="Actions" height=150 subtitle="neutral · active · selected · destructive · play" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title>
<style>
html,body{margin:0}
body{padding:16px;background:var(--background);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:22px}
.pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pv-col{display:flex;flex-direction:column;gap:12px}
.pv-grid{display:grid;gap:16px}
.pv-cap{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:var(--text-tertiary);min-width:64px}
.pv-sep{width:1px;height:28px;background:var(--border-subtle);margin:0 4px}
.pv-icon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--border-subtle);color:var(--text-primary)}
.pv-icon .pv-cap{min-width:0;font-size:10px}

</style></head>
<body>
<div id="root"></div>
<script>
var I = window.Icyre, h = React.createElement;
function row(){ return h.apply(null, ['div', {className:'pv-row'}].concat([].slice.call(arguments))); }
function cap(t){ return h('span',{className:'pv-cap'},t); }
function mount(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
mount(h('div',{className:'pv-col'},
  row(cap('variants'), h(I.IconButton,{icon:'heart',label:'Like'}), h(I.IconButton,{icon:'heart',label:'Liked',variant:'active',pressed:true}), h(I.IconButton,{icon:'queue',label:'Queue',variant:'selected',pressed:true}), h(I.IconButton,{icon:'close',label:'Remove',variant:'destructive'}), h(I.IconButton,{icon:'play',label:'Play',variant:'play'}), h(I.IconButton,{icon:'play',label:'Play',variant:'play',size:'lg'})),
  row(cap('states'), h(I.IconButton,{icon:'more',label:'More'}), h(I.IconButton,{icon:'more',label:'More',forceState:'hover'}), h(I.IconButton,{icon:'more',label:'More',forceState:'pressed'}), h(I.IconButton,{icon:'more',label:'More',forceState:'focus'}), h(I.IconButton,{icon:'more',label:'More',disabled:true}), cap('sizes'), h(I.IconButton,{icon:'search',label:'Search',size:'sm'}), h(I.IconButton,{icon:'search',label:'Search'}), h(I.IconButton,{icon:'search',label:'Search',size:'lg'}))
));
</script>
</body>
</html>

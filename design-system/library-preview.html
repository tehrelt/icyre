<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICYRE Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components/bundle.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--background);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: var(--type-body-size);
    line-height: var(--type-body-line);
    -webkit-font-smoothing: antialiased;
  }
  .lib-shell {
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    min-height: 100vh;
  }
  .lib-side {
    background: var(--background-subtle);
    border-right: var(--border-hairline) solid var(--border-subtle);
    padding: var(--space-5) var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .lib-logo { padding: var(--space-1) var(--space-3) var(--space-2); }
  .lib-nav { display: flex; flex-direction: column; gap: 2px; }
  .lib-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .lib-toolbar {
    height: 64px;
    padding: 0 var(--gutter-desktop);
    border-bottom: var(--border-hairline) solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    background: rgba(245, 247, 250, 0.86);
    backdrop-filter: blur(12px);
  }
  .lib-page {
    padding: var(--space-8) var(--gutter-desktop) var(--space-16);
    max-width: var(--container-max);
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
  }
  .lib-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-6);
    flex-wrap: wrap;
  }
  .lib-head-text {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }
  .lib-title {
    margin: 0;
    font-size: var(--type-h1-size);
    line-height: var(--type-h1-line);
    font-weight: var(--type-h1-weight);
    letter-spacing: var(--type-h1-tracking);
  }
  .lib-filter { width: 320px; max-width: 100%; }
  .lib-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    border-bottom: var(--border-hairline) solid var(--border-subtle);
  }
  .lib-controls .ic-tabs { border-bottom: 0; }
  .lib-spotlight {
    display: grid;
    grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
    gap: var(--space-6);
    align-items: center;
  }
  .lib-spotlight-copy {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .lib-spotlight-title {
    margin: 0;
    font-size: var(--type-h2-size);
    line-height: var(--type-h2-line);
    font-weight: var(--type-h2-weight);
    letter-spacing: var(--type-h2-tracking);
  }
  .lib-spotlight-actions {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-2);
  }
  .lib-section {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .lib-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
  }
  .lib-section-title {
    margin: 0;
    font-size: var(--type-h3-size);
    line-height: var(--type-h3-line);
    font-weight: var(--type-h3-weight);
    letter-spacing: var(--type-h3-tracking);
  }
  .lib-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--gap-grid);
  }
  @media (max-width: 1199px) {
    .lib-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .lib-spotlight { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 767px) {
    .lib-shell { grid-template-columns: minmax(0, 1fr); }
    .lib-side { display: none; }
    .lib-page { padding: var(--space-5) var(--gutter-mobile) var(--space-10); }
    .lib-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./components/lib/react.production.min.js"></script>
<script src="./components/lib/react-dom.production.min.js"></script>
<script src="./components/bundle.js"></script>

</body>
</html>

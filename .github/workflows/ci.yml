# CI (EPIC-036): Go workspace consistency, formatting, vet, unit tests with
# and without the race detector, golangci-lint, the web app and every
# Docker image. Integration tests against the compose stack — EPIC-037.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  workspace:
    name: go.work and go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Every module is in go.work
        run: make work-check
      - name: go.work.sum and module requirements are in sync
        run: |
          go work sync
          git diff --exit-code -- go.work go.work.sum '*/go.mod' '*/go.sum' \
            || { echo "::error::run 'make sync' and commit the result"; exit 1; }
      - name: Every module is tidy on its own (Docker builds use GOWORK=off)
        run: make mod-check

  go:
    name: fmt, vet, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Race detector
        run: make test-race

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('**/go.sum', '.golangci.yml') }}
          restore-keys: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - name: Lint every module
        run: make lint

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - run: make web-lint
      - run: make scripts-typecheck
      - run: make web-test
      - run: make web-build

  images-matrix:
    name: list Docker images
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.list.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          echo "dockerfiles=$(find services workers -name Dockerfile | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.dockerfile }}
    needs: images-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.images-matrix.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: name
        run: echo "name=$(basename "$(dirname "${{ matrix.dockerfile }}")")" >> "$GITHUB_OUTPUT"
      # Build context is the repository root: services depend on libs/*.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: icyre/${{ steps.name.outputs.name }}:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.name.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.name }}

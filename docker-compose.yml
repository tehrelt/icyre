name: icyre

# Local development stand: `docker compose up -d` starts everything.
# Host ports: API Gateway 8080 (/api/v1) · Catalog 8081 · BFF 8082 · Auth 8083 · User Profile 8084
#             Stream Auth 8085 · Search 8086 · Library 8088 · Playback 8089 · History 8090 · Playlist 8091 · Media Ingest 8092 · PostgreSQL 5432 · Redis 6379 · Kafka 9094 · MinIO 9000 (console 9001, icyre / icyre-secret) · OpenSearch 9200 · Jaeger UI 16686 · Prometheus 9090 · Grafana 3000 (admin / admin)

x-catalog-env: &catalog-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-auth-env: &auth-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
  # No AUTH_SIGNING_KEY locally: Auth generates an ephemeral key per process
  # (sessions survive a restart through refresh, access tokens do not).

x-profile-env: &profile-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-history-env: &history-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-analytics-env: &analytics-env
  APP_ENV: local
  LOG_LEVEL: info
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USERNAME: icyre
  CLICKHOUSE_PASSWORD: icyre
  CLICKHOUSE_DATABASE: icyre
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8080
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-recommendation-env: &recommendation-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USERNAME: icyre
  CLICKHOUSE_PASSWORD: icyre
  CLICKHOUSE_DATABASE: icyre
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8080
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-playlist-env: &playlist-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8080
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-library-env: &library-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8080
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

x-media-env: &media-env
  APP_ENV: local
  LOG_LEVEL: info
  DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  CATALOG_URL: http://catalog:8080
  AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
  S3_ENDPOINT: minio:9000
  # Upload URLs must be reachable from the browser (as for stream-auth).
  S3_PUBLIC_ENDPOINT: localhost:9000
  S3_ACCESS_KEY: icyre
  S3_SECRET_KEY: icyre-secret
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318

services:
  # --- core -----------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: icyre
      POSTGRES_USER: icyre
      POSTGRES_PASSWORD: icyre
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icyre -d icyre"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9094:9094"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Derived search index (ADR-0004). Security plugin is off on the local stand
  # only; production runs with TLS and authentication.
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # The node sees the whole host disk; on a nearly full laptop disk the
      # watermarks would block index creation. Never disable in production.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Analytics store (EPIC-027). HTTP interface only: the native port 9000
  # would clash with MinIO. Schema: libs/contracts/analytics, applied by
  # the analytics-migrate job (`make migrate` locally).
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: icyre
      CLICKHOUSE_USER: icyre
      CLICKHOUSE_PASSWORD: icyre
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports: ["8123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # MinIO Inc. no longer publishes community images; pgsty/minio rebuilds the
  # upstream AGPL sources (minio + mc) and is pinned here.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: icyre
      MINIO_ROOT_PASSWORD: icyre-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      MINIO_ROOT_USER: icyre
      MINIO_ROOT_PASSWORD: icyre-secret
    volumes: ["./deploy/minio/init.sh:/scripts/init.sh:ro"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes: ["./deploy/kafka/create-topics.sh:/scripts/create-topics.sh:ro"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  # --- services -------------------------------------------------------------
  catalog-migrate:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    image: icyre/catalog:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *catalog-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  catalog:
    image: icyre/catalog:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *catalog-env
    ports: ["8081:8080"]
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  bff:
    build: { context: ., dockerfile: services/bff/Dockerfile }
    image: icyre/bff:local
    pull_policy: build
    environment:
      APP_ENV: local
      CATALOG_URL: http://catalog:8080
      LIBRARY_URL: http://library:8080
      HISTORY_URL: http://history:8080
      PLAYLIST_URL: http://playlist:8080
      USER_PROFILE_URL: http://user-profile:8080
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    ports: ["8082:8080"]
    depends_on: [catalog, library, history, playlist, user-profile]
    restart: unless-stopped

  auth-migrate:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    image: icyre/auth:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *auth-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  auth:
    image: icyre/auth:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *auth-env
    ports: ["8083:8080"]
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  user-profile-migrate:
    build: { context: ., dockerfile: services/user-profile/Dockerfile }
    image: icyre/user-profile:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *profile-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  user-profile:
    image: icyre/user-profile:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *profile-env
    ports: ["8084:8080"]
    depends_on:
      user-profile-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth: { condition: service_started }
    restart: unless-stopped

  library-migrate:
    build: { context: ., dockerfile: services/library/Dockerfile }
    image: icyre/library:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *library-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  library:
    image: icyre/library:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *library-env
    ports: ["8088:8080"]
    depends_on:
      library-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  history-migrate:
    build: { context: ., dockerfile: services/history/Dockerfile }
    image: icyre/history:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *history-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  history:
    image: icyre/history:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *history-env
    ports: ["8090:8080"]
    depends_on:
      history-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth: { condition: service_started }
    restart: unless-stopped

  playlist-migrate:
    build: { context: ., dockerfile: services/playlist/Dockerfile }
    image: icyre/playlist:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *playlist-env
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  playlist:
    image: icyre/playlist:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *playlist-env
    ports: ["8091:8080"]
    depends_on:
      playlist-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  playback:
    build: { context: ., dockerfile: services/playback/Dockerfile }
    image: icyre/playback:local
    pull_policy: build
    environment:
      APP_ENV: local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    ports: ["8089:8080"]
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      auth: { condition: service_started }
    restart: unless-stopped

  media-ingest-migrate:
    build: { context: ., dockerfile: services/media-ingest/Dockerfile }
    image: icyre/media-ingest:local
    pull_policy: build
    command: ["migrate"]
    environment:
      <<: *media-env
      KAFKA_ENABLED: "false"
      OTEL_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  media-ingest:
    image: icyre/media-ingest:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *media-env
    ports: ["8092:8080"]
    depends_on:
      media-ingest-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  stream-auth:
    build: { context: ., dockerfile: services/stream-auth/Dockerfile }
    image: icyre/stream-auth:local
    pull_policy: build
    environment:
      APP_ENV: local
      REDIS_ADDR: redis:6379
      CATALOG_URL: http://catalog:8080
      AUTH_JWKS_URL: http://auth:8080/api/v1/auth/.well-known/jwks.json
      S3_ENDPOINT: minio:9000
      # Signed URLs must be reachable from the browser: MinIO acts as the
      # media origin locally (a CDN in front of object storage in production).
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: icyre
      S3_SECRET_KEY: icyre-secret
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    ports: ["8085:8080"]
    depends_on:
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  transcoder:
    build: { context: ., dockerfile: workers/transcoder/Dockerfile }
    image: icyre/transcoder:local
    pull_policy: build
    # track.uploaded -> tracks/{id}/audio/{64,128,256}.aac -> track.transcoded
    environment:
      APP_ENV: local
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: icyre
      S3_SECRET_KEY: icyre-secret
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    tmpfs: ["/tmp:size=1g"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  metadata-worker:
    build: { context: ., dockerfile: workers/metadata/Dockerfile }
    image: icyre/metadata-worker:local
    pull_policy: build
    # track.uploaded -> ffprobe over a presigned URL -> media_metadata -> media.metadata_extracted
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
      MIGRATE_ON_START: "true"
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: icyre
      S3_SECRET_KEY: icyre-secret
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  audio-analysis-worker:
    build: { context: ., dockerfile: workers/audio-analysis/Dockerfile }
    image: icyre/audio-analysis-worker:local
    pull_policy: build
    # track.uploaded -> ffmpeg over a presigned URL (BPM, EBU R128 loudness, silence) -> audio_features -> audio.features_extracted
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://icyre:icyre@postgres:5432/icyre?sslmode=disable
      MIGRATE_ON_START: "true"
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: icyre
      S3_SECRET_KEY: icyre-secret
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Analytics (EPIC-028): playback.events -> ClickHouse, daily aggregates.
  # Backfill: docker compose run --rm analytics aggregate -from 2026-09-01 -to 2026-09-27
  # Report:   docker compose run --rm analytics report -from 2026-09-21 -to 2026-09-27
  analytics-migrate:
    build: { context: ., dockerfile: workers/analytics/Dockerfile }
    image: icyre/analytics:local
    pull_policy: build
    command: ["migrate"]
    environment: *analytics-env
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: "no"

  analytics:
    image: icyre/analytics:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *analytics-env
    depends_on:
      analytics-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
    restart: unless-stopped

  # Recommendations (EPIC-029): the worker builds sets into Redis, the service serves them.
  # One-off build: docker compose run --rm recommendation-worker build
  recommendation-worker-migrate:
    build: { context: ., dockerfile: workers/recommendation/Dockerfile }
    image: icyre/recommendation-worker:local
    pull_policy: build
    command: ["migrate"]
    environment: *recommendation-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  recommendation-worker:
    image: icyre/recommendation-worker:local
    # Built by the migrate job above; never pulled from a registry.
    pull_policy: never
    environment: *recommendation-env
    depends_on:
      recommendation-worker-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
    restart: unless-stopped

  recommendation:
    build: { context: ., dockerfile: services/recommendation/Dockerfile }
    image: icyre/recommendation:local
    pull_policy: build
    environment: *recommendation-env
    ports: ["8097:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_started }
    restart: unless-stopped

  search-indexer:
    build: { context: ., dockerfile: workers/search-indexer/Dockerfile }
    image: icyre/search-indexer:local
    pull_policy: build
    # Rebuild the indices from Catalog and Playlist: docker compose run --rm search-indexer reindex
    environment:
      APP_ENV: local
      OPENSEARCH_URL: http://opensearch:9200
      KAFKA_BROKERS: kafka:9092
      CATALOG_URL: http://catalog:8080
      PLAYLIST_URL: http://playlist:8080
      USER_PROFILE_URL: http://user-profile:8080
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      opensearch: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      catalog: { condition: service_started }
      playlist: { condition: service_started }
      user-profile: { condition: service_started }
    restart: unless-stopped

  search:
    build: { context: ., dockerfile: services/search/Dockerfile }
    image: icyre/search:local
    pull_policy: build
    environment:
      APP_ENV: local
      OPENSEARCH_URL: http://opensearch:9200
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
    ports: ["8086:8080"]
    depends_on:
      opensearch: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    volumes: ["./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [bff, catalog, auth, user-profile, stream-auth, search, library, playback, history, playlist, media-ingest, recommendation]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- observability --------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP
    # The image is distroless (no shell for a healthcheck); Jaeger is not a
    # dependency of any service, exporters retry on their own.

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  clickhouse-data:
  minio-data:
  opensearch-data:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
